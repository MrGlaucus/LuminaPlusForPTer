<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>手机端紧凑列表 · 设计预览</title>
  <style>
    * { box-sizing:border-box; }
    :root { font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color-scheme:light; --bg:#f4f5f7; --panel:#fff; --text:#252a32; --sub:#8b929c; --line:#ebedf0; --track:#edf0f3; --green:#42af82; --orange:#efa944; --red:#e76f75; --blue:#4586e9; }
    body.dark { color-scheme:dark; --bg:#171b21; --panel:#22272e; --text:#eef1f5; --sub:#9aa3ae; --line:#353c45; --track:#39414b; --green:#64caa0; --orange:#f3bc68; --red:#ee8c91; --blue:#7caaff; }
    body { margin:0; background:#e1e4e9; color:var(--text); }
    .stage { min-height:100vh; display:grid; justify-items:center; align-content:start; gap:12px; padding:20px 12px 36px; }
    .caption { width:min(390px,100%); font-size:12px; color:#56606f; }
    .phone { width:min(390px,100%); min-height:790px; padding:22px 14px 30px; border-radius:25px; background:var(--bg); box-shadow:0 20px 45px #15243b24; }
    .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .brand { font-size:17px; font-weight:760; letter-spacing:-.03em; }
    .theme { border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--sub); padding:6px 8px; font:600 11px inherit; cursor:pointer; }
    .tabs { display:flex; width:max-content; max-width:100%; gap:3px; margin-bottom:17px; padding:3px; border-radius:10px; background:var(--panel); }
    .tabs span { padding:6px 12px; border-radius:7px; color:var(--sub); font-size:11px; font-weight:650; }
    .tabs .active { color:var(--text); background:var(--bg); box-shadow:0 1px 3px #00000010; }
    .group { display:flex; align-items:center; gap:7px; margin:0 1px 9px; font-size:11px; font-weight:730; }
    .chevron { display:grid; place-items:center; width:18px; height:18px; border-radius:5px; background:var(--panel); color:var(--sub); }
    .count { padding:1px 5px; border-radius:6px; background:var(--panel); color:var(--sub); font-size:10px; }
    .group:after { content:""; height:1px; flex:1; background:var(--line); }
    .list { overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
    .row { display:block; min-width:0; padding:10px 10px 9px; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; }
    .row:last-child { border-bottom:0; }
    .row:active { background:color-mix(in srgb,var(--blue) 6%,var(--panel)); }
    .head { display:flex; align-items:center; min-width:0; gap:5px; height:18px; margin-bottom:7px; }
    .dot { width:6px; height:6px; flex:none; border-radius:50%; background:var(--green); }
    .flag { font-size:12px; line-height:1; }
    .name { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:12px; font-weight:720; }
    .ping { margin-left:auto; flex:none; color:var(--sub); font-size:10px; font-variant-numeric:tabular-nums; }
    .detail { margin-left:3px; color:var(--sub); font-size:15px; line-height:1; }
    .cells { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:3px; }
    .cell { min-width:0; }
    .label { margin-bottom:2px; color:var(--sub); font-size:9px; line-height:1; white-space:nowrap; }
    .value { overflow:hidden; white-space:nowrap; font-size:11px; font-weight:740; line-height:1.2; font-variant-numeric:tabular-nums; letter-spacing:-.025em; }
    .value small { font-size:9px; font-weight:600; }
    .bar { width:90%; height:3px; margin-top:5px; overflow:hidden; border-radius:4px; background:var(--track); }
    .bar i { display:block; height:100%; border-radius:4px; background:var(--green); }
    .bar.warn i { background:var(--orange); }
    .bar.high i { background:var(--red); }
    .up { color:var(--blue); }
    .down { color:var(--green); }
    .offline .dot { background:var(--red); }
    .offline .name,.offline .value { color:var(--sub); }
    .offline .bar i { display:none; }
    .annotation { margin:15px 2px 0; color:var(--sub); font-size:10px; line-height:1.55; }
    @media (max-width:460px) { body { background:var(--bg); } .stage { padding:0; } .caption { display:none; } .phone { width:100%; min-height:100vh; border-radius:0; box-shadow:none; } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption">手机端紧凑列表 · 静态设计样稿（每条约 72px）</div>
    <main class="phone">
      <header class="top"><div class="brand">Lumina Ops</div><button class="theme" onclick="document.body.classList.toggle('dark');this.textContent=document.body.classList.contains('dark')?'浅色':'深色'">深色</button></header>
      <div class="tabs"><span class="active">全部</span><span>生产</span><span>边缘</span><span>备份</span></div>
      <div class="group"><span class="chevron">⌄</span><span>生产</span><span class="count">4</span></div>
      <div class="list" id="production"></div>
      <p class="annotation">一条实例是一整行，点按后进入详情。示例数据；指标颜色与当前主题保持一致。</p>
    </main>
  </div>
  <script>
    const rows = [
      {flag:'🇯🇵',name:'Tokyo Edge',ping:'23 ms',cpu:18,mem:36,disk:34,load:'2.10',up:'17.2',down:'68.7'},
      {flag:'🇸🇬',name:'Singapore API',ping:'58 ms',cpu:46,mem:43,disk:57,load:'9.20',up:'30.5',down:'93.5'},
      {flag:'🇩🇪',name:'Frankfurt DB',ping:'187 ms',cpu:91,mem:88,disk:83,load:'27.40',up:'7.63',down:'22.9'},
      {flag:'🇺🇸',name:'New York Worker',ping:'离线',offline:true},
    ];
    const meter = (label,value) => `<div class="cell"><div class="label">${label}</div><div class="value">${value ?? '—'}${value == null ? '' : '%'}</div><div class="bar ${value >= 90 ? 'high' : value >= 75 ? 'warn' : ''}"><i style="width:${value ?? 0}%"></i></div></div>`;
    document.querySelector('#production').innerHTML = rows.map(row => `<a class="row ${row.offline ? 'offline' : ''}" href="#"><div class="head"><span class="dot"></span><span class="flag">${row.flag}</span><span class="name">${row.name}</span><span class="ping">${row.ping}</span><span class="detail">›</span></div><div class="cells">${meter('CPU',row.cpu)}${meter('内存',row.mem)}${meter('存储',row.disk)}<div class="cell"><div class="label">负载</div><div class="value">${row.load ?? '—'}</div></div><div class="cell"><div class="label">↑ 上传</div><div class="value up">${row.up ?? '—'}<small>${row.up ? 'M/s' : ''}</small></div></div><div class="cell"><div class="label">↓ 下载</div><div class="value down">${row.down ?? '—'}<small>${row.down ? 'M/s' : ''}</small></div></div></div></a>`).join('');
  </script>
</body>
</html>
